name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch_contributions.py"
      - "scripts/render_heatmap_svg.py"
      - ".github/workflows/update-profile-art.yml"

concurrency:
  group: profile-art-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install daily-workflow dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Fetch public contribution data
        env:
          GITHUB_USERNAME: dusssi
        run: python scripts/fetch_contributions.py
      - name: Render animated heatmap
        run: python scripts/render_heatmap_svg.py
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Commit, rebase, and push refreshed calendar
        run: |
          git add data/contributions.json contrib-heatmap.svg
          if git diff --cached --quiet; then
            echo "No generated profile-art changes to commit."
          else
            git commit -m "chore: refresh contribution graph [skip ci]"
          fi
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
